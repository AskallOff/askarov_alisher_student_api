spring.application.name=askarov-alisher-student-api
server.port=8080

# Owner of the application (shown on GET /)
student.full-name=Alisher Askarov
student.group=IT2-2304
student.id=38226

# Database connection comes from the environment (docker-compose.yml, .env);
# the values after ":" are only defaults for a local run
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/askarov_alisher_db}
spring.datasource.username=${DB_USER:askarov}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
